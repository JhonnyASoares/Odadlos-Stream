<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stream Odadlos</title>
    <link rel="stylesheet" href="interface.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body
    class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-center p-2"
  >
    <!-- Tela Inicial / Configuração -->
    <div
      id="setup-screen"
      class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl shadow-xl max-w-md w-full text-center"
    >
      <h1 class="text-2xl font-bold mb-2">Odadlos Stream</h1>
      <p class="text-zinc-400 text-sm mb-6">
        Compartilhe sua tela com seus amigos em tempo real.
      </p>

      <input
        id="room-input"
        type="text"
        placeholder="Nome da Sala (ex: amigos)"
        class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-3 mb-4 text-white focus:outline-none focus:border-indigo-500"
      />

      <button
        id="join-btn"
        class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-lg transition-colors cursor-pointer"
      >
        Entrar na Sala
      </button>
    </div>

    <!-- Tela de Transmissão -->

    <div id="stream-screen" class="hidden">
      <h2 id="room-title" class="font-semibold text-lg">
        Sala: <span class="text-indigo-400"></span>
      </h2>
      <div id="buttons-container" class="flex gap-3">
        <button
          id="share-btn"
          class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg font-medium text-sm transition-colors cursor-pointer"
        >
          Compartilhar Tela
        </button>
        <button
          id="leave-btn"
          class="bg-rose-600 hover:bg-rose-500 px-4 py-2 rounded-lg font-medium text-sm transition-colors cursor-pointer"
        >
          Sair
        </button>
      </div>

      <!-- Grid de Vídeos -->
      <div id="videos-grid" class="videos-container-grid">
        <!-- Seu vídeo local -->
        <div
          id="local-container"
          class="video-cont hidden relative bg-zinc-900 rounded-xl overflow-hidden border border-zinc-800 aspect-video flex items-center justify-center transition-all duration-300"
        >
          <video
            id="local-video"
            autoplay
            muted
            playsinline
            class="w-full h-full object-contain"
          ></video>
          <span
            class="absolute bottom-3 left-3 bg-black/60 px-3 py-1 rounded text-xs font-medium"
            >Você</span
          >

          <!-- Controles no topo direito -->
          <div
            class="video-options absolute bottom-3 right-3 flex items-center gap-2 bg-black/60 backdrop-blur-sm p-1.5 rounded-lg border border-white/10"
          >
            <!-- Controle de Volume -->
            <div class="volume-input flex items-center gap-1.5 px-1">
              <svg
                class="w-4 h-4 text-zinc-300"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"
                ></path>
              </svg>
              <input
                type="range"
                min="0"
                max="1"
                step="0.05"
                value="1"
                oninput="changeVolume('local-video', this.value)"
                class="volume-slider w-16 accent-indigo-500 cursor-pointer"
              />
            </div>
            <div class="h-4 w-[1px] bg-white/20"></div>
            <!-- Butão de prioridade -->
            <button
              onclick="toggleExpand('local-container')"
              class="hover:bg-white/10 p-1.5 rounded text-xs font-medium transition-colors cursor-pointer flex items-center justify-center"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 512 512"
                width="16"
                height="16"
              >
                <path
                  d="M 485 327 L 476 321 L 473 320 L 465 320 L 464 321 L 461 321 L 456 324 L 452 328 L 449 333 L 449 336 L 448 337 L 448 404 L 447 405 L 339 405 L 338 406 L 334 406 L 325 412 L 320 422 L 320 430 L 321 431 L 321 434 L 324 439 L 331 445 L 337 447 L 473 447 L 483 442 L 487 437 L 490 428 L 490 339 L 489 338 L 489 334 Z M 26 327 L 22 334 L 22 338 L 21 339 L 21 428 L 22 429 L 22 433 L 28 442 L 38 447 L 174 447 L 180 445 L 187 439 L 191 430 L 191 422 L 186 412 L 177 406 L 173 406 L 172 405 L 64 405 L 63 404 L 63 337 L 61 331 L 55 324 L 46 320 L 38 320 L 35 321 Z M 110 158 L 107 165 L 107 346 L 110 353 L 115 358 L 125 362 L 386 362 L 396 358 L 400 354 L 404 346 L 404 165 L 401 158 L 396 153 L 386 149 L 125 149 L 115 153 Z M 148 192 L 149 191 L 362 191 L 363 192 L 363 319 L 362 320 L 149 320 L 148 319 Z M 324 72 L 321 77 L 321 80 L 320 81 L 320 89 L 325 99 L 334 105 L 338 105 L 339 106 L 447 106 L 448 107 L 448 174 L 449 175 L 449 178 L 452 183 L 456 187 L 465 191 L 473 191 L 476 190 L 485 184 L 489 177 L 489 173 L 490 172 L 490 83 L 489 82 L 489 78 L 483 69 L 473 64 L 337 64 L 331 66 Z M 24 181 L 28 186 L 38 191 L 46 191 L 55 187 L 61 180 L 63 174 L 63 107 L 64 106 L 172 106 L 173 105 L 177 105 L 184 101 L 190 92 L 191 89 L 191 81 L 189 75 L 183 68 L 174 64 L 38 64 L 28 69 L 24 74 L 21 83 L 21 172 Z"
                  fill="#FFF"
                  fill-rule="evenodd"
                />
              </svg>
            </button>
            <div class="h-4 w-[1px] bg-white/20"></div>
            <!-- Maximizar -->
            <button
              onclick="toggleMaximize('local-container')"
              class="hover:bg-white/10 p-1.5 rounded text-xs font-medium transition-colors cursor-pointer flex items-center justify-center"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="interface.js"></script>
    <script src="client.js"></script>
  </body>
</html>
